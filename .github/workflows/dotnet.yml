name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore wowfishbot.slnx

      - name: Build
        run: dotnet build wowfishbot.slnx --configuration Release --no-restore

      - name: Publish Windows executable
        run: dotnet publish wowfishbot/wowfishbot.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=true --output publish/win-x64

      - name: Create ZIP archive
        shell: pwsh
        run: |
          if (Test-Path publish/wowfishbot-win-x64.zip) {
            Remove-Item publish/wowfishbot-win-x64.zip -Force
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            "publish/win-x64",
            "publish/wowfishbot-win-x64.zip",
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: wowfishbot-win-x64
          path: publish/win-x64
          if-no-files-found: error

      - name: Ensure alpha release exists
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: "alpha"
              });
            } catch (error) {
              if (error.status === 404) {
                core.setFailed("Required release tag 'alpha' does not exist. Create it manually first.");
                return;
              }
              throw error;
            }

      - name: Publish release asset
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: alpha
          name: Alpha
          files: publish/wowfishbot-win-x64.zip
