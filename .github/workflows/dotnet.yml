name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore wowfishbot.slnx

      - name: Build
        run: dotnet build wowfishbot.slnx --configuration Release --no-restore

      - name: Publish Windows executable
        run: dotnet publish wowfishbot/wowfishbot.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=true --output publish/win-x64

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: wowfishbot-win-x64
          path: publish/win-x64
          if-no-files-found: error
